x-api-settings:
  rate_limit:
    default: 100
    per_minute: true
  pagination:
    default_per_page: 20
    max_per_page: 100
  file_upload:
    max_size_bytes: 5368709120
    allowed_types:
      - application/pdf
      - application/epub+zip
      - text/markdown
      - text/plain
      - video/mp4
      - audio/mpeg
  data_retention:
    soft_delete_days: 30
    permanent_delete_days: 90
